apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: camber-dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [camber.inmatics.io]
      secretName: camber-tls
  rules:
    - host: camber.inmatics.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: camber-dashboard
                port:
                  number: 80
