# Public entry for https://camber.inmatics.io (DNS: CNAME aws009.inmatics.io). cert-manager
# keeps the certificate in camber-tls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cambercredit
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [camber.inmatics.io]
      secretName: camber-tls
  rules:
    - host: camber.inmatics.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cambercredit
                port:
                  number: 80
